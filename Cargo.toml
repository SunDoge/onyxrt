[workspace]
members = ["crates/onyxrt-sys", "crates/onyxrt", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.92"
homepage = "https://github.com/SunDoge/onyxrt"
repository = "https://github.com/SunDoge/onyxrt"
readme = "README.md"

[workspace.dependencies]
dlpark = "0.11.0"
libloading = "0.9.0"
snafu = "0.9.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
