[package]
name = "onyxrt"
description = "Safe dynamically loaded ONNX Runtime bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
documentation = "https://docs.rs/onyxrt"
keywords = ["onnx", "onnxruntime", "inference", "dlpack", "machine-learning"]
categories = ["api-bindings", "science"]
include = ["src/**", "tests/**", "CHANGELOG.md", "../../README.md", "LICENSE-MIT"]

[dependencies]
dlpark = { workspace = true, optional = true }
half = { workspace = true, optional = true }
snafu.workspace = true
onyxrt-sys = { path = "../onyxrt-sys", version = "0.1.1" }

[features]
default = []
half = ["dep:half"]
# DLPack is deliberately opt-in. Integration-specific dlpark features are
# forwarded individually; dlpark's `cpu-all` test bundle is not public API.
dlpack = ["dep:dlpark"]
dlpack-candle = ["dlpack", "dlpark/candle"]
dlpack-cudarc = ["dlpack", "dlpark/cudarc"]
dlpack-half = ["dlpack", "half", "dlpark/half"]
dlpack-image = ["dlpack", "dlpark/image"]
dlpack-ndarray = ["dlpack", "dlpark/ndarray"]
dlpack-pyo3 = ["dlpack", "dlpark/pyo3"]
dlpack-safetensors = ["dlpack", "dlpark/safetensors"]

[dev-dependencies]
dlpark = { workspace = true, features = ["ndarray"] }
ndarray = "0.17"

[lints]
workspace = true
