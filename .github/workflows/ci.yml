name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: onyxrt
    steps:
      - uses: actions/checkout@v4
        with:
          path: onyxrt
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: |
          cargo xtask download-header --check
          cargo xtask bindgen --check
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --no-deps -- -D warnings
      - run: cargo test --workspace

  check-macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: onyxrt
    steps:
      - uses: actions/checkout@v4
        with:
          path: onyxrt
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --no-deps -- -D warnings
      - run: cargo test --workspace

  cpu-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onyxrt
    steps:
      - uses: actions/checkout@v4
        with:
          path: onyxrt
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - name: Locate ONNX Runtime
        shell: bash
        run: |
          path="$(uv run --locked python - <<'PY'
          import glob
          import os
          import onnxruntime

          root = os.path.join(os.path.dirname(onnxruntime.__file__), "capi")
          matches = sorted(glob.glob(os.path.join(root, "libonnxruntime.so*")))
          if not matches:
              raise SystemExit("onnxruntime wheel did not contain libonnxruntime.so")
          print(matches[-1])
          PY
          )"
          echo "ONYXRT_TEST_DYLIB=$path" >> "$GITHUB_ENV"
      - run: cargo test -p onyxrt --test cpu_identity cpu_dlpack_identity_round_trip -- --ignored
