name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: onyxrt
    steps:
      - uses: actions/checkout@v4
        with:
          path: onyxrt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -p onyxrt -p onyxrt-sys -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --no-deps -- -D warnings
      - run: cargo test --workspace
      - run: cargo check --workspace --no-default-features --features link-static

  cpu-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onyxrt
    steps:
      - uses: actions/checkout@v4
        with:
          path: onyxrt
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install onnxruntime
      - name: Locate ONNX Runtime
        shell: bash
        run: |
          path="$(python - <<'PY'
          import glob
          import os
          import onnxruntime

          root = os.path.join(os.path.dirname(onnxruntime.__file__), "capi")
          matches = sorted(glob.glob(os.path.join(root, "libonnxruntime.so*")))
          if not matches:
              raise SystemExit("onnxruntime wheel did not contain libonnxruntime.so")
          print(matches[-1])
          PY
          )"
          echo "ONYXRT_TEST_DYLIB=$path" >> "$GITHUB_ENV"
      - run: cargo test -p onyxrt --test cpu_identity cpu_dlpack_identity_round_trip -- --ignored
